services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: streamgive
      POSTGRES_PASSWORD: streamgive
      POSTGRES_DB: streamgive
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamgive']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL: inside the compose network the
      # database is reachable at the service name, not localhost.
      DATABASE_URL: postgresql://streamgive:streamgive@postgres:5432/streamgive
    ports:
      - '3000:3000'
    # No `prisma db push` on boot here anymore: the production image
    # deliberately omits the prisma CLI (see Dockerfile). Sync the schema
    # from the host once instead — `npm run db:push` against
    # postgresql://streamgive:streamgive@localhost:5432/streamgive — before
    # starting this service.

volumes:
  postgres-data:
